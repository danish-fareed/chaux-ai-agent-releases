name: Publish verified Agent 2.9.1
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Expiring read URL for the already-tested Windows build artifact
        required: true
        type: string
      artifact_sha256:
        description: GitHub authenticated SHA256 of the tested Windows artifact ZIP
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: danish-fareed/chaux-ai-agent-releases
      ARTIFACT_URL: ${{ inputs.artifact_url }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Download, authenticate and inspect the tested artifact
        run: |
          python -m pip install pyinstaller==6.22.3 --quiet
          python - <<'PY'
          import hashlib, json, os, shutil, types, urllib.parse, urllib.request, zipfile
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader
          url = os.environ['ARTIFACT_URL']
          print('::add-mask::' + url)
          parsed = urllib.parse.urlparse(url)
          assert parsed.scheme == 'https' and parsed.hostname.endswith('.blob.core.windows.net')
          with urllib.request.urlopen(url, timeout=60) as source, open('tested-artifact.zip','wb') as output:
              shutil.copyfileobj(source, output)
          def digest(path):
              with open(path,'rb') as source: return hashlib.file_digest(source,'sha256').hexdigest()
          assert len(os.environ['ARTIFACT_SHA256']) == 64
          assert os.environ['ARTIFACT_SHA256'] == '19603b349625278ee4a8ffb01d08a90e8ca88218b98f661b2ad24f5ad8b12dbe'
          assert digest('tested-artifact.zip') == os.environ['ARTIFACT_SHA256']
          Path('artifacts').mkdir()
          expected = {'chaux-agent-windows-v2.9.1.exe':None, 'chaux-agent-windows-v2.9.1-setup.exe':None}
          with zipfile.ZipFile('tested-artifact.zip') as archive:
              for name in [*expected, 'release-manifest.json']:
                  entries = [entry for entry in archive.namelist() if entry.split('/')[-1] == name]
                  assert len(entries) == 1, (name, 'ambiguous artifact')
                  with archive.open(entries[0]) as source, open(Path('artifacts')/name,'wb') as output:
                      shutil.copyfileobj(source, output)
          manifest = json.loads(Path('artifacts/release-manifest.json').read_text('utf-8-sig'))
          expected = {manifest[k]['file']:manifest[k]['sha256'] for k in ('installer','standalone')}
          assert set(expected) == {'chaux-agent-windows-v2.9.1.exe','chaux-agent-windows-v2.9.1-setup.exe'}
          for name, sha in expected.items(): assert digest(Path('artifacts')/name) == sha
          assert manifest['schema_version'] == 2 and manifest['agent_version'] == '2.9.1' and manifest['channel'] == 'stable'
          assert manifest['installer']['file'] == 'chaux-agent-windows-v2.9.1-setup.exe'
          assert manifest['installer']['sha256'] == expected[manifest['installer']['file']]
          assert manifest['installer']['size'] == Path('artifacts',manifest['installer']['file']).stat().st_size
          assert manifest['installer']['url'] == 'https://github.com/danish-fareed/chaux-ai-agent-releases/releases/download/v2.9.1/chaux-agent-windows-v2.9.1-setup.exe'
          assert manifest['standalone']['sha256'] == expected[manifest['standalone']['file']]
          assert manifest['authenticode']['required'] is False
          assert manifest['authenticode']['publisher'] == manifest['authenticode']['status'] == 'Unknown'
          assert manifest['minimum_supported_version'] == '1.12.1'
          config = json.loads(CArchiveReader('artifacts/chaux-agent-windows-v2.9.1.exe').extract('chaux-release.json'))
          assert config['app_origin'] == 'https://chaux.jangoo.org' and config['release_channel'] == 'stable'
          assert config['update_manifest_url'] == 'https://chaux.jangoo.org/agent-downloads/update-manifest.json'
          assert config['beta_update_manifest_url'] == 'https://chaux.jangoo.org/agent-downloads/update-manifest-beta.json'
          assert config['previous_version'] == '2.7.1'
          assert config['previous_installer_sha256'] == '9450ef4bfb08987ef0dd101095d22886b05730a817c7430a5f84fdf048414bea'
          expected_code = {'desktop': '17cbec47daa3af552b878a861ac6380ac956dd6dff897775febfb2900adbb854', 'diagnostics': '4f420b2a4419b24cd6486eed4055aa31cd0c4fcfc7b1df97dfea4dc4bb0ec00d', 'main': 'ffb9d95b058af7852dd22f849ba4ee34d4bae016fc743352bf281e0333801868', 'remote_mcp': 'e89031724fa584f3271e206b127d09877e6443dde001b87378358e1f06e13422', 'subprocess_utils': '4328fdc744dce12f867667fe293729f7e835e5fccb2eba7ccd65270dd2534492', 'updater': '437271098835e17603848d5f182e7344f7408b53cbc952256b012f1ddf77f5b3', 'video_studio': 'ec0f742f8c23a5872bda7b5cb52d72d746a89c7131c5becd6f09467eac5662cc', 'lifecycle': '06252190c1bf51377c41c40b0f20d581b1f5c8365a0418a3bf1506d0d80f519b', 'source_discovery': '07535ec6d9aae0fdbd37f103caec807a9a6413cefa9650f05a601b338e448449', 'source_errors': '7b58846a35a7168c88309b6ab82134e362a241d8d903b638ebf1a9b42aa68f1d', 'source_inspection': '1ad21570cc402e40b3c10c9a98ad3867fbf6dfc090b4f8931e14c3db80ca5fd9', 'video_studio_api': '1c8f0ea35c04556e415265faf2987b30d09fd14ddd053bebeaad008ad17d3c17'}
          def normalize(value):
              if isinstance(value,types.CodeType):
                  return (value.co_code.hex(),value.co_names,value.co_varnames,value.co_flags,tuple(normalize(c) for c in value.co_consts))
              if isinstance(value,tuple):return tuple(normalize(v) for v in value)
              if isinstance(value,frozenset):return ('frozenset',tuple(sorted((normalize(v) for v in value),key=repr)))
              if isinstance(value,bytes):return ('bytes',value.hex())
              return value
          reader=CArchiveReader('artifacts/chaux-agent-windows-v2.9.1.exe').open_embedded_archive('PYZ.pyz')
          for name,expected in expected_code.items():
              actual=hashlib.sha256(repr(normalize(reader.extract('clip_agent.'+name))).encode('utf-8')).hexdigest()
              assert actual==expected, ('Frozen source differs',name)
          assert manifest['installer']['sha256']=='49c4736ba729db3e310b4adba8e653c8055dcd012dea8edc0f04ccab4482f0d4'
          assert manifest['standalone']['sha256']=='5400fe44d05ad0b12cc9ba8f30bfd2d65cfbbb05c5a23a559855d8e806e06759'
          print('Verified all 12 frozen modules against qualified source 9569648')
          print(json.dumps({'verified_archive':True,'verified_config':True,'installer':manifest['installer'],'standalone':manifest['standalone']}))
          PY
      - name: Create immutable release draft and upload verified files
        run: |
          gh release create v2.9.1 --draft --title "Chaux Agent 2.9.1" --notes "Restore the original compact Agent window and colors; remove desktop/web theme sync. Keep safe idle-only restart, component rechecks, clearer connection expiry, and recoverable unpublished source drafts without repeated reuse-permission prompts. Existing device identity, projects, media and settings are preserved. Unsigned Windows publisher: Unknown."
          gh release upload v2.9.1 artifacts/chaux-agent-windows-v2.9.1.exe artifacts/chaux-agent-windows-v2.9.1-setup.exe artifacts/release-manifest.json
      - name: Independently download and compare every uploaded file
        run: |
          gh release download v2.9.1 --dir verification
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in Path('artifacts').iterdir():
              other = Path('verification')/path.name
              assert path.stat().st_size == other.stat().st_size
              with path.open('rb') as source, other.open('rb') as downloaded:
                  assert hashlib.file_digest(source,'sha256').digest() == hashlib.file_digest(downloaded,'sha256').digest()
              print('Independently verified:', path.name, path.stat().st_size)
          PY
      - name: Publish latest and verify anonymous HTTPS delivery
        run: |
          gh release edit v2.9.1 --draft=false --latest
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          local = json.loads(Path('artifacts/release-manifest.json').read_text('utf-8-sig'))
          public = json.load(urllib.request.urlopen('https://github.com/danish-fareed/chaux-ai-agent-releases/releases/download/v2.9.1/release-manifest.json'))
          assert local == public
          request = urllib.request.Request(local['installer']['url'], method='HEAD')
          with urllib.request.urlopen(request) as response:
              assert response.status == 200
              assert int(response.headers['Content-Length']) == local['installer']['size']
          base='https://github.com/danish-fareed/chaux-ai-agent-releases/releases/download/v2.9.1/'
          for name in [local['installer']['file'],local['standalone']['file']]:
              with urllib.request.urlopen(base+name,timeout=60) as source,open('public-'+name,'wb') as output:
                  while chunk:=source.read(8*1024*1024):output.write(chunk)
              with open('public-'+name,'rb') as source,open(Path('artifacts')/name,'rb') as expected:
                  assert hashlib.file_digest(source,'sha256').digest()==hashlib.file_digest(expected,'sha256').digest()
              print('Anonymous public bytes verified:',name)
          print('Latest public release and anonymous installer download verified.')
          PY
